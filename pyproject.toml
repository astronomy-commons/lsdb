[project]
name = "lsdb"
license = "BSD-3-Clause"
license-files = ["LICENSE", "CITATION.bib"]
readme = "README.md"
description = "Spatial analysis for extremely large astronomical catalogs using dask"
authors = [
    { name = "LINCC Frameworks", email = "lincc-frameworks-team@lists.lsst.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    # Includes dask[array,dataframe,distributed,diagnostics].
    # dask distributed eases the creation of parallel dask clients.
    # dask diagnostics is required to spin up the dashboard for profiling.
    "dask[complete]>=2025.3.0",
    "deprecated",
    "hats>=0.11.2, <0.12.0",
    "human_readable>=2.0.0",
    "nested-pandas>=0.7.3,<0.8.0",
    "numpy",
    "pyarrow",
    "scipy>=1.7.2", # kdtree
    "tabulate>=0.7.0",
    "universal-pathlib",
    "tqdm>=4.59.0",
]

[project.urls]
source = "https://github.com/astronomy-commons/lsdb"
documentation = "https://lsdb.readthedocs.io/"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "asv==0.6.6", # Used to compute performance benchmarks
    "astropy", # Needed for testing astropy table loading
    "ruff", # Used for static linting of files
    "jupyter", # Clears output from Jupyter notebooks
    "mypy", # Used for static type checking of files
    "pandas-stubs", # additional type info for pandas, used for static type checking of files
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "pytest-mock", # Used to mock objects in tests
    "types-tabulate", # Type information for tabulate
]
s3fs = [
    "s3fs>0.5",
]
full = [
    "fsspec[full]", # complete file system specs.
    "ipykernel", # Support for Jupyter notebooks
    "ipywidgets", # useful for tqdm in notebooks.
    "lancedb", # Used to write lance datasets in to_lance.py
    "pylance", # needed for lance testing
    "lsst-sphgeom ; sys_platform == 'darwin' or sys_platform == 'linux'", # To handle spherical sky polygons, not available on Windows
    "matplotlib",
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/lsdb/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"
log_cli_level = "INFO"

[tool.setuptools.package-data]
lsdb = ["py.typed"]

[tool.coverage.report]
omit = [
    "src/lsdb/_version.py", # auto-generated
]

[tool.ruff]
line-length = 110
extend-exclude = ["benchmarks/env"]

[tool.ruff.lint]
exclude = ["*.ipynb"] # Notebooks are auto-formatted but not linted
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
    # flake8-print
    "T201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
    "B905", # Allow zip() without strict= (adding it could change behavior)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow re-exports in package __init__ files
"tests/**" = ["D101", "D102", "D103", "D106", "T201"] # Docstrings and print() are not required in tests
"benchmarks/**" = ["D101", "D102", "D103", "D106", "T201"] # Docstrings and print() are not required in benchmarks
"docs/**" = ["D101", "D102", "D103", "D106", "T201"] # Docstrings and print() are not required in docs and notebooks

[tool.coverage.run]
omit=["src/lsdb/_version.py"]

[tool.mypy]
plugins = "pydantic.mypy"
disable_error_code = ["operator"]
