
# This workflow will install Python dependencies, run tests and report code coverage with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit test and code coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - name: Install dependencies
      run: |
        sudo apt-get update
        if [ -f requirements.txt ]; then
          uv pip install --system -e .[dev] -r requirements.txt
        else
          uv pip install --system -e .[dev]
        fi
    - name: Run unit tests with pytest
      run: |
        python -m pytest -o log_cli=true -vv --cov=lsdb --cov-report=xml
    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  test-lowest-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        sudo apt-get update
        python -m pip install --upgrade uv
        uv venv venv
        source venv/bin/activate
        if [ -f requirements.txt ]; then
          uv pip compile --resolution=lowest-direct pyproject.toml requirements.txt -o requirements_lowest.txt
        else
          uv pip compile --resolution=lowest-direct pyproject.toml -o requirements_lowest.txt
        fi
        uv pip install --constraint=requirements_lowest.txt -e .[dev]
    - name: List dependencies
      run: |
        pip list
    - name: Run unit tests with pytest
      run: |
        source venv/bin/activate
        python -m pytest